# Kääntää HummAPP Android -sovelluksen ja tallentaa asennettavan APK:n artefaktiksi.
# Lataus: GitHub -> Actions -> "Android APK" -> viimeisin ajo -> Artifacts -> hummapp-debug-apk
name: Android APK

on:
  push:
    paths:
      - "hummapp/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hummapp/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHubin ubuntu-ajokoneessa Android SDK on valmiina ($ANDROID_HOME)
      - name: Android SDK -paketit
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Käännä debug-APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hummapp-debug-apk
          path: hummapp/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
