{% extends "base.html" %}
{% set hide_topbar = True %}
{% block title %}Kirjaudu{% endblock %}
{% block body %}
<main class="login" id="sisalto">
    <div class="login__card">
        <div class="login__brand">Humm<b>APP</b></div>
        <p class="login__lead">Talliseuranta: videoleikkeet, juominen ja talli-ilma.</p>
        <div class="panel">
            <div class="panel__body">
                {% if error %}<div class="flash flash--error" role="alert">{{ error }}</div>{% endif %}
                <form action="/web/login" method="post">
                    <div class="field">
                        <label for="username">Käyttäjätunnus</label>
                        <input class="input" type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="none">
                    </div>
                    <div class="field">
                        <label for="password">Salasana</label>
                        <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary btn--block">Kirjaudu sisään</button>
                    </div>
                </form>
            </div>
        </div>
        <p class="small muted" style="margin-top: var(--space-4)">Tunnukset saat tallin ylläpitäjältä.</p>
    </div>
</main>
{% endblock %}
