{% extends "base.html" %}

{% block title %}Kirjaudu - HummAPP | Kaustisen seutukunta{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-slate-200 p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-[#1B325E] font-display">Humm<span class="text-[#C60651]">APP</span></h1>
            <p class="text-sm text-[#6D6E71] mt-1">Kirjaudu sisään talliseurantaan</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-[#A1342C]/30 rounded-lg text-[#A1342C] text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/web/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-[#58595B] uppercase tracking-wider mb-1">Käyttäjätunnus</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#1B325E] focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#58595B] uppercase tracking-wider mb-1">Salasana</label>
                <input type="password" name="password" required
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#1B325E] focus:outline-none text-sm">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 bg-[#1B325E] hover:bg-[#135367] text-white font-semibold rounded-lg shadow-sm transition text-sm">
                Kirjaudu sisään
            </button>
        </form>

        <div class="mt-6 text-xs text-[#6D6E71] text-center border-t border-slate-100 pt-4">
            Kaustisen seutukunnan pilottijärjestelmä &bull; Oletustunnus: <code class="bg-slate-100 px-1 py-0.5 rounded text-[#1B325E]">admin</code>
        </div>
    </div>
</div>
{% endblock %}
